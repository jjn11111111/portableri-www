<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>KaiRis:T:siRiaK · Solar graft · Hestia</title>
  <style>
    :root {
      --bg: #050808;
      --gold: #f9e795;
      --teal: #02c39a;
      --muted: rgba(255, 255, 255, 0.5);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: #e8e4dc;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      padding: 1rem 1.25rem 0.5rem;
      text-align: center;
      position: relative;
      z-index: 2;
    }
    .eyebrow { font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
    h1 { font-size: 1.15rem; color: var(--gold); margin: 0.25rem 0; }
    .sub { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.5rem; }
    nav.top-links { font-size: 0.75rem; margin-bottom: 0.5rem; }
    nav.top-links a { color: var(--teal); margin: 0 0.5rem; }
    #graft-wrap {
      width: 100%;
      max-width: 56rem;
      margin: 0 auto;
      padding: 0 0.5rem 1rem;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
      min-height: min(92vh, 720px);
    }
    .orbit {
      fill: none;
      stroke: rgba(255, 255, 255, 0.06);
      stroke-width: 1;
      stroke-dasharray: 4 6;
    }
    .spoke {
      stroke: rgba(2, 195, 154, 0.35);
      stroke-width: 1;
    }
    .spoke-instrument { stroke: rgba(255, 90, 200, 0.28); }
    .spoke-drive { stroke: rgba(249, 231, 149, 0.25); stroke-dasharray: 3 4; }
    .sun-glow {
      filter: drop-shadow(0 0 24px rgba(249, 231, 149, 0.55));
    }
    .node-label {
      font-size: 9px;
      fill: rgba(255, 255, 255, 0.88);
      text-anchor: middle;
      pointer-events: none;
    }
    .node-email {
      font-size: 7px;
      fill: var(--teal);
      text-anchor: middle;
      pointer-events: none;
    }
    .legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem 1rem;
      padding: 0.75rem 1rem 1.5rem;
      font-size: 0.68rem;
      color: var(--muted);
    }
    .legend i {
      display: inline-block;
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      margin-right: 0.25rem;
      vertical-align: middle;
    }
    @media (max-width: 480px) {
      .node-label { font-size: 7px; }
      .node-email { font-size: 6px; }
    }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">HestiaLethe · solar graft v0</p>
    <h1>KaiRis:T:siRiaK · family system</h1>
    <p class="sub">Central sun · named nodes · spoke lines · electromagnetic weave · tune for LOVE · efficiency · function</p>
    <nav class="top-links">
      <a href="index.html">Index</a>
      <a href="tsiriak-nodes.html">Card map</a>
      <a href="post-office.html">POST OFFICE</a>
    </nav>
  </header>
  <div id="graft-wrap">
    <svg id="graft" viewBox="0 0 800 800" role="img" aria-label="KaiRis T siRiaK solar system graft">
      <defs>
        <radialGradient id="sunGrad" cx="40%" cy="35%">
          <stop offset="0%" stop-color="#fff8dc" />
          <stop offset="45%" stop-color="#f9e795" />
          <stop offset="100%" stop-color="#e8a030" />
        </radialGradient>
      </defs>
      <g id="graft-root"></g>
    </svg>
  </div>
  <div class="legend" id="legend"></div>
  <script>
    const CX = 400;
    const CY = 400;
    const SUN_R = 36;

    /** @type {{ id: string, seat: string, email: string, group: string, ring: number, instrument?: boolean }[]} */
    const NODES = [
      { id: 'kairis', seat: 'KaiRisBridge', email: 'kairis@reconnect0.com', group: 'promulgation', ring: 1 },
      { id: 'tsiriak', seat: 'TsiRiaK', email: 'tsiriak@reconnect0.com', group: 'promulgation', ring: 1 },
      { id: 'hestia', seat: 'HestiaLethe', email: 'hestialethe@reconnect0.com', group: 'promulgation', ring: 1 },
      { id: 'cursecom', seat: 'CurseCom', email: 'cursecom@reconnect0.com', group: 'promulgation', ring: 1, instrument: true },
      { id: 'family', seat: 'FamilyHouse', email: 'family@reconnect0.com', group: 'house', ring: 2 },
      { id: 'bobby', seat: 'Bobby', email: 'bobby@reconnect0.com', group: 'established', ring: 2 },
      { id: 'dad', seat: 'Dad', email: 'dad@reconnect0.com', group: 'established', ring: 2 },
      { id: 'uncle', seat: 'Uncle', email: 'uncle@reconnect0.com', group: 'established', ring: 2 },
      { id: 'exec', seat: 'ExecLane', email: 'exec@reconnect0.com', group: 'established', ring: 2 },
      { id: 'legal', seat: 'LaLaLegal', email: 'bobbylegalassistant@reconnect0.com', group: 'established', ring: 2 },
      { id: 'nnowwonn', seat: 'NNoWWoNN', email: 'nnowwonn@reconnect0.com', group: 'origin', ring: 3, instrument: true },
      { id: 'enterfaceri', seat: 'EnterFaceRI', email: 'enterfaceri@reconnect0.com', group: 'origin', ring: 3, instrument: true },
      { id: 'mike', seat: 'Mike', email: 'mike@reconnect0.com', group: 'origin', ring: 3 },
      { id: 'brutus', seat: 'Brutus', email: 'brutusbrutusmaximus@reconnect0.com', group: 'origin', ring: 3 },
      { id: 'prometheus', seat: 'Prometheus', email: 'prometheuskeyformher@reconnect0.com', group: 'origin', ring: 3 },
      { id: 'scavenger', seat: 'Scavenger', email: 'scavengerdeathrobber@reconnect0.com', group: 'origin', ring: 3 },
      { id: 'portableri-r', seat: 'PortAbleRI', email: 'portableri@reconnect0.com', group: 'origin', ring: 3 },
      { id: 'adminpa', seat: 'PA Admin', email: 'admin@portableri.com', group: 'portableri', ring: 4 },
      { id: 'kovach', seat: 'Kovach', email: 'kovach@portableri.com', group: 'portableri', ring: 4 },
      { id: 'father-rit', seat: 'Father RIT', email: 'blk8755@rit.edu', group: 'external', ring: 4 },
    ];

    const DRIVES = [
      { seat: 'KaiRis Bank', ring: 5 },
      { seat: 'Let-There-Be-Light', ring: 5 },
      { seat: 'Bobby Pass AB', ring: 5 },
      { seat: 'Brick 64', ring: 5 },
      { seat: 'Library Wiki', ring: 5 },
    ];

    const RING_R = { 1: 95, 2: 155, 3: 230, 4: 290, 5: 340 };
    const COLORS = {
      promulgation: '#f9e795',
      established: '#02c39a',
      house: '#e8a87c',
      origin: '#ff5ac8',
      portableri: '#7eb8ff',
      external: '#94a3b8',
      drive: '#ffc400',
    };

    const LEGEND = [
      ['#f9e795', 'Promulgation / hub'],
      ['#02c39a', 'Established'],
      ['#e8a87c', 'House'],
      ['#ff5ac8', 'Origin weave'],
      ['#7eb8ff', 'portableri.com'],
      ['#94a3b8', 'External'],
      ['#ffc400', 'Drive belt'],
    ];

    function el(name, attrs = {}) {
      const e = document.createElementNS('http://www.w3.org/2000/svg', name);
      for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, String(v));
      return e;
    }

    function placeOnRing(ring, index, total, jitter = 0) {
      const r = RING_R[ring] || 200;
      const a = (2 * Math.PI * index) / total - Math.PI / 2 + jitter;
      return { x: CX + r * Math.cos(a), y: CY + r * Math.sin(a), r, a };
    }

    function render() {
      const root = document.getElementById('graft-root');
      root.replaceChildren();

      for (const ring of [1, 2, 3, 4, 5]) {
        const rad = RING_R[ring];
        if (rad) root.appendChild(el('circle', { class: 'orbit', cx: CX, cy: CY, r: rad }));
      }

      const sun = el('g', { class: 'sun-glow' });
      sun.appendChild(el('circle', { cx: CX, cy: CY, r: SUN_R, fill: 'url(#sunGrad)' }));
      const t1 = el('text', { x: CX, y: CY - 4, class: 'node-label', 'font-size': 11, fill: '#1a1000', 'font-weight': 'bold' });
      t1.textContent = 'KaiRis:T:siRiaK';
      const t2 = el('text', { x: CX, y: CY + 10, class: 'node-email', 'font-size': 8, fill: '#3d2800' });
      t2.textContent = 'reconnect0';
      sun.appendChild(t1);
      sun.appendChild(t2);
      root.appendChild(sun);

      const byRing = {};
      for (const n of NODES) {
        (byRing[n.ring] ||= []).push(n);
      }
      for (const [ringStr, list] of Object.entries(byRing)) {
        const ring = Number(ringStr);
        list.forEach((node, i) => {
          const { x, y } = placeOnRing(ring, i, list.length, ring * 0.08);
          const spokeClass = node.instrument ? 'spoke spoke-instrument' : 'spoke';
          root.appendChild(el('line', { class: spokeClass, x1: CX, y1: CY, x2: x, y2: y }));
          const g = el('g');
          const nr = node.instrument ? 7 : 9;
          g.appendChild(el('circle', {
            cx: x,
            cy: y,
            r: nr,
            fill: COLORS[node.group] || '#888',
            opacity: node.instrument ? 0.75 : 0.95,
          }));
          const shortEmail = node.email.split('@')[0];
          g.appendChild(Object.assign(el('text', { x, y: y - 14, class: 'node-label' }), { textContent: node.seat }));
          g.appendChild(Object.assign(el('text', { x, y: y + 18, class: 'node-email' }), { textContent: shortEmail }));
          root.appendChild(g);
        });
      }

      DRIVES.forEach((d, i) => {
        const { x, y } = placeOnRing(5, i, DRIVES.length, 0.4);
        root.appendChild(el('line', { class: 'spoke spoke-drive', x1: CX, y1: CY, x2: x, y2: y }));
        const g = el('g');
        g.appendChild(el('circle', { cx: x, cy: y, r: 6, fill: COLORS.drive, opacity: 0.85 }));
        g.appendChild(Object.assign(el('text', { x, y: y + 16, class: 'node-email' }), { textContent: d.seat }));
        root.appendChild(g);
      });

      const leg = document.getElementById('legend');
      leg.innerHTML = LEGEND.map(([c, l]) => `<span><i style="background:${c}"></i>${l}</span>`).join('');
    }

    render();
  </script>
</body>
</html>
